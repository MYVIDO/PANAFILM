<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a0a12">
  <title>PANAFILM | معرض الفيديو والصور</title>
  <meta name="description" content="معرض PANAFILM: فيديوهات وصور تُضاف تلقائياً من مستودع GitHub.">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://raw.githubusercontent.com; media-src 'self' https://raw.githubusercontent.com; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="curtain" aria-hidden="true"><i></i><i></i></div>

  <header class="marquee">
    <h1>PANAFILM</h1>
    <p>معرض الفيديو والصور</p>
    <div class="tabs" role="group" aria-label="تصفية المعرض">
      <button type="button" class="tab" data-filter="all" aria-pressed="true">الكل</button>
      <button type="button" class="tab" data-filter="video" aria-pressed="false">فيديو</button>
      <button type="button" class="tab" data-filter="image" aria-pressed="false">صور</button>
    </div>
  </header>

  <main>
    <p id="status" role="status">جارٍ تحميل المعرض…</p>
    <section id="grid" class="grid" aria-label="المعرض"></section>
  </main>

  <footer class="colophon">
    <p>&copy; <span id="year">2026</span> <bdi>PANAFILM</bdi></p>
  </footer>

  <dialog id="viewer" aria-label="عارض الوسائط">
    <div class="vbar">
      <button type="button" class="btn" id="v-close">إغلاق</button>
      <span id="v-title"></span>
      <span class="vnav">
        <button type="button" class="btn" id="v-prev">السابق</button>
        <button type="button" class="btn" id="v-next">التالي</button>
      </span>
    </div>
    <div class="stage" id="stage"></div>
  </dialog>

  <script src="script.js" defer></script>
</body>
</html>
